name: Room Rota Notification

on:
  # Scheduled sending has moved to the Cloudflare Worker (cloudflare-worker/worker.js —
  # SLPRotaSlavebot), which also handles on-demand queries and self-service sign-up.
  # Leaving this schedule enabled here as well would double-send every clinic morning.
  # Kept as workflow_dispatch only, for manual testing / emergency fallback.
  #
  # schedule:
  #   - cron: '45 5 * * 3,4,5'
  #   - cron: '0 6 * * 3,4,5'
  #   - cron: '15 6 * * 3,4,5'
  #   - cron: '30 6 * * 3,4,5'
  #   - cron: '45 6 * * 3,4,5'
  #   - cron: '0 7 * * 3,4,5'
  #   - cron: '15 7 * * 3,4,5'

  workflow_dispatch:

jobs:
  send-rota-link:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Send rota notification
        run: python rota_bot.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SHEET_CSV_URL: ${{ secrets.SHEET_CSV_URL }}
          FORCE_SEND: ${{ github.event_name == 'workflow_dispatch' && 'true' || 'false' }}
